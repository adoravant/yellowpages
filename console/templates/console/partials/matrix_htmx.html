{% load static %}
<div class="panel" id="matrix-wrapper">

    <div class="panel-title">Tactical_Matrix</div>

    <div class="excel-matrix">

        <!-- esquina vacía -->
        <div></div>

        <!-- headers columnas -->
        <div class="header-cell ic-profile"><i class="bi bi-person-check"></i></div>
        <div class="header-cell ic-pain"><i class="bi bi-emoji-frown"></i></div>
        <div class="header-cell ic-hook"><i class="bi bi-lightning-charge"></i></div>

        <!-- ===== FILTRO 1 ===== -->
        <div 
            class="header-cell ic-time filter-btn active"
            hx-get="{% url 'console:matrix_filter' 'SET_1' %}"
            hx-target="#matrix-body"
            hx-swap="innerHTML"
        >
            <i class="bi bi-clock"></i>
        </div>

        <!-- ===== MATRIX BODY ===== -->
        <div id="matrix-body" style="display: contents;">
            
            <!-- AVANCE -->
            {% for btn in scenario.get_grid.AVANCE %}
                <button 
                    class="action-btn btn-avance"
                    title="{{ btn.label }}"
                    hx-post="{% url 'console:matrix_action' %}"
                    hx-vals='{"action_id": "{{ btn.id }}"}'
                    hx-target="#matrix-wrapper"
                    hx-swap="outerHTML"
                >
                    {% if btn.icon %}
                        <i class="bi bi-{{ btn.icon }}"></i>
                    {% endif %}
                    <span>{{ btn.label|default:"---" }}</span>
                </button>
            {% endfor %}

            <!-- ===== FILTRO 2 ===== -->
            <div 
                class="header-cell ic-search filter-btn"
                hx-get="{% url 'console:matrix_filter' 'SET_2' %}"
                hx-target="#matrix-body"
                hx-swap="innerHTML"
            >
                <i class="bi bi-search"></i>
            </div>

            <!-- STALL -->
            {% for btn in scenario.get_grid.STALL %}
                <button 
                    class="action-btn btn-stall"
                    title="{{ btn.label }}"
                    hx-post="{% url 'console:matrix_action' %}"
                    hx-vals='{"action_id": "{{ btn.id }}"}'
                    hx-target="#matrix-wrapper"
                    hx-swap="outerHTML"
                >
                    {% if btn.icon %}
                        <i class="bi bi-{{ btn.icon }}"></i>
                    {% endif %}
                    <span>{{ btn.label|default:"---" }}</span>
                </button>
            {% endfor %}

            <!-- ===== FILTRO 3 ===== -->
            <div 
                class="header-cell ic-kill filter-btn"
                hx-get="{% url 'console:matrix_filter' 'SET_3' %}"
                hx-target="#matrix-body"
                hx-swap="innerHTML"
            >
                <i class="bi bi-x-circle"></i>
            </div>

            <!-- CLOSE -->
            {% for btn in scenario.get_grid.CLOSE %}
                <button 
                    class="action-btn btn-close"
                    title="{{ btn.label }}"
                    hx-post="{% url 'console:matrix_action' %}"
                    hx-vals='{"action_id": "{{ btn.id }}"}'
                    hx-target="#matrix-wrapper"
                    hx-swap="outerHTML"
                >
                    {% if btn.icon %}
                        <i class="bi bi-{{ btn.icon }}"></i>
                    {% endif %}
                    <span>{{ btn.label|default:"---" }}</span>
                </button>
            {% endfor %}

        </div>

    </div>

</div>
