{% load static %}
<div class="panel">

    <div class="panel-title">Mission_Log</div>

    <div class="note-input d-flex gap-2 mb-2">
        <input id="noteInput" class="input-custom flex-grow-1" placeholder="Add entry...">
        <button class="btn btn-dark btn-sm" onclick="addNote()">
            <i class="bi bi-plus"></i>
        </button>
    </div>

    <div id="notes" class="flex-grow-1 overflow-auto">
        <div class="note"><b>14:10</b> - Lead caliente por caída de sitio.</div>
    </div>

    <div class="d-flex gap-2 mt-2">

        <div class="d-flex gap-1" style="width:70%">

            <!-- VALIDATION -->
            <div class="header-cell ic-profile flex-fill" onclick="toggleDiag(this)" title="Validate">
                <i class="bi bi-person-check"></i>
            </div>

            <!-- PAIN -->
            <div class="header-cell ic-pain flex-fill" onclick="toggleDiag(this)" title="Pain">
                <i class="bi bi-emoji-frown"></i>
            </div>

            <!-- INTEREST -->
            <div class="header-cell flex-fill" onclick="toggleDiag(this)" title="Interest">
                <i class="bi bi-lightbulb"></i>
            </div>

            <!-- CAPACITY / MONEY -->
            <div class="header-cell flex-fill" onclick="toggleDiag(this)" title="Capacity / Money">
                <i class="bi bi-cash-stack"></i>
            </div>

            <!-- OFFER -->
            <div class="header-cell ic-hook flex-fill" onclick="toggleDiag(this)" title="Offer">
                <i class="bi bi-lightning-charge"></i>
            </div>

            <!-- CALL -->
            <div class="header-cell ic-time flex-fill" onclick="toggleDiag(this)" title="Call">
                <i class="bi bi-telephone"></i>
            </div>

            <!-- MEET -->
            <div class="header-cell flex-fill" onclick="toggleDiag(this)" title="Meet">
                <i class="bi bi-camera-video"></i>
            </div>

            <!-- QUOTE -->
            <div class="header-cell flex-fill" onclick="toggleDiag(this)" title="Quote">
                <i class="bi bi-currency-dollar"></i>
            </div>

            <!-- CONTRACT -->
            <div class="header-cell flex-fill" onclick="toggleDiag(this)" title="Contract">
                <i class="bi bi-file-earmark-text"></i>
            </div>

        </div>

        <button class="btn btn-main" style="width:30%" onclick="location.reload()">
            SAVE
        </button>

    </div>

</div>
