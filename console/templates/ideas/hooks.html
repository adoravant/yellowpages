<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Matrix | Architect Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #020408; --bg-card: #0a0f1a; --border: #1e293b;
            --text: #f1f5f9; --muted: #64748b; --accent: #fbbf24;
            --c-event: #8b5cf6; --c-btn: #38bdf8; --c-scene: #22c55e; --c-flow: #ef4444;
        }

        * { box-sizing: border-box; outline: none; }
        body { background: var(--bg-deep); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR MASTER --- */
        .sidebar { 
            width: 80px; background: var(--bg-card); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; align-items: center; padding: 25px 0; gap: 35px; 
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; transition: 0.3s; width: 100%; }
        .nav-item i { transition: 0.3s; }
        .nav-item span { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item:hover, .nav-item.active { color: var(--accent); }
        .nav-item.active { border-right: 3px solid var(--accent); }

        /* --- LAYOUT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at 100% 0%, #0d1526 0%, #020408 100%); }
        
        /* TOP BAR */
        .top-bar { 
            height: 60px; border-bottom: 1px solid var(--border); background: rgba(10,15,26,0.8); 
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
        }
        .search-bar { background: #000; border: 1px solid var(--border); padding: 8px 15px; border-radius: 6px; width: 400px; display: flex; align-items: center; gap: 10px; }
        .search-bar input { background: transparent; border: none; color: #fff; font-size: 12px; width: 100%; }

        /* WORKSPACE */
        .workspace { flex: 1; display: flex; overflow: hidden; }
        
        /* LEFT PANEL: LIBRERÍA (Abstracta) */
        .library-panel { width: 320px; border-right: 1px solid var(--border); background: rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .panel-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        
        .item-card { 
            background: #070b14; border: 1px solid var(--border); border-radius: 6px; 
            padding: 12px; margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .item-card:hover { border-color: var(--accent); }
        .item-card.active { border-left: 4px solid var(--accent); background: #0a1628; }
        .item-tag { font-family: 'JetBrains Mono'; font-size: 9px; color: var(--muted); }

        /* RIGHT PANEL: EDITOR DE ADN */
        .editor-panel { flex: 1; padding: 40px; overflow-y: auto; }
        .editor-header { margin-bottom: 40px; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

        /* INPUTS SYSTEM */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .m-input { background: #05080f; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 6px; width: 100%; font-family: 'Inter'; }
        .m-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(251, 191, 36, 0.1); }
        
        /* WORKFLOW VISUALIZER (Para la pestaña Workflows) */
        .flow-chain { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
        .flow-node { background: #0a0f1a; border: 1px solid var(--border); padding: 15px; border-radius: 8px; min-width: 150px; text-align: center; position: relative; }
        .flow-node::after { content: '→'; position: absolute; right: -18px; top: 50%; transform: translateY(-50%); color: var(--muted); }
        .flow-node:last-child::after { display: none; }

        .btn-main { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 900; font-size: 11px; cursor: pointer; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="nav-item active" onclick="setView('EventTypes', 'zap')">
        <i data-lucide="zap"></i><span>Types</span>
    </div>
    <div class="nav-item" onclick="setView('Triggers', 'settings-2')">
        <i data-lucide="settings-2"></i><span>Triggers</span>
    </div>
    <div class="nav-item" onclick="setView('Buttons', 'mouse-pointer-2')">
        <i data-lucide="mouse-pointer-2"></i><span>Buttons</span>
    </div>
    <div class="nav-item" onclick="setView('Scenarios', 'layout-grid')">
        <i data-lucide="layout-grid"></i><span>Matrix</span>
    </div>
    <div class="nav-item" onclick="setView('Workflows', 'git-branch')">
        <i data-lucide="git-branch"></i><span>Flows</span>
    </div>
    <div style="flex:1"></div>
    <div class="nav-item" style="color:var(--c-event)">
        <i data-lucide="activity"></i><span>Live</span>
    </div>
</aside>

<main class="main-content">
    <header class="top-bar">
        <div style="display:flex; align-items:center; gap:20px;">
            <h2 id="current-view-title" style="margin:0; font-size:18px; letter-spacing:-0.5px;">EventTypes Config</h2>
            <div class="search-bar">
                <i data-lucide="search" size="16" style="color:var(--muted)"></i>
                <input type="text" placeholder="Buscar en el ADN del sistema...">
            </div>
        </div>
        <button class="btn-main">DEPLOY CHANGES</button>
    </header>

    <div class="workspace">
        <section class="library-panel">
            <div class="panel-header">
                <span id="list-title" style="font-size:11px; font-weight:900; color:var(--muted)">AVAILABLE_TYPES</span>
                <i data-lucide="plus-circle" style="cursor:pointer; color:var(--accent)" size="18"></i>
            </div>
            <div class="list-container" id="master-list">
                </div>
        </section>

        <section class="editor-panel">
            <div class="editor-header">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <span id="editor-tag" class="item-tag" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:4px; font-weight:900;">UID: 4402</span>
                    <span style="color:var(--muted)">/ Configuración Maestra</span>
                </div>
                <h1 id="editor-title" style="margin:0; font-size:32px; font-weight:900;">intent_validation_owner</h1>
            </div>

            <div class="editor-grid">
                <div class="form-group">
                    <label>Internal Slug (Unique)</label>
                    <input type="text" class="m-input" value="intent_validation_owner">
                </div>
                <div class="form-group">
                    <label>Human Name</label>
                    <input type="text" class="m-input" value="Es el Dueño">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select class="m-input">
                        <option>INTENT</option>
                        <option>SYSTEM</option>
                        <option>REPLY</option>
                    </select>
                </div>
                <div class="form-group" style="display:flex; align-items:center; gap:20px; padding-top:25px;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" checked>
                        <label style="margin:0">Should Alert?</label>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="checkbox" checked>
                        <label style="margin:0">Allowed Auto</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>TTL Hours (Ciclo de Vida)</label>
                    <input type="number" class="m-input" value="24">
                </div>
                <div class="form-group">
                    <label>Alert Priority (1-10)</label>
                    <input type="number" class="m-input" value="8">
                </div>
            </div>

            <div style="margin-top:40px; border-top:1px solid var(--border); padding-top:30px;">
                <label>Logic Preview (Pipeline)</label>
                <div class="flow-chain">
                    <div class="flow-node" style="border-color:var(--c-event)">
                        <span style="font-size:9px; color:var(--c-event); font-weight:900;">EVENT</span>
                        <div style="font-size:11px; font-weight:700;">owner_reply</div>
                    </div>
                    <div class="flow-node" style="border-color:var(--c-btn)">
                        <span style="font-size:9px; color:var(--c-btn); font-weight:900;">TRIGGER</span>
                        <div style="font-size:11px; font-weight:700;">send_welcome</div>
                    </div>
                    <div class="flow-node">
                        <span style="font-size:9px; color:var(--muted); font-weight:900;">ACTION</span>
                        <div style="font-size:11px; font-weight:700;">WhatsApp API</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
    const data = {
        EventTypes: ['intent_validation', 'intent_pain', 'intent_call', 'system_error'],
        Triggers: ['auto_welcome', 'alert_stalled', 'jump_to_pain'],
        Buttons: ['btn_is_owner', 'btn_not_now', 'btn_too_expensive'],
        Scenarios: ['Validation_Stage_Home', 'Pain_Stage_Money', 'Global_Outs'],
        Workflows: ['Onboarding_Flow', 'Re-engagement_Flow']
    };

    function setView(view, icon) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('current-view-title').innerText = view + ' Configuration';
        document.getElementById('list-title').innerText = 'AVAILABLE_' + view.toUpperCase();
        
        const listContainer = document.getElementById('master-list');
        listContainer.innerHTML = data[view].map(item => `
            <div class="item-card ${item.includes('validation') ? 'active' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:12px; font-weight:700;">${item}</span>
                    <i data-lucide="chevron-right" size="14" style="color:var(--muted)"></i>
                </div>
                <span class="item-tag">slug: matrix.io/${item}</span>
            </div>
        `).join('');
        
        lucide.createIcons();
    }

    // Init
    setView('EventTypes', 'zap');
</script>
</body>
</html>
